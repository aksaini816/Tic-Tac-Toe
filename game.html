<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tic Tac Toe</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <h1 id="game-title">Tic Tac Toe</h1>
    <h2 id="turn-indicator"></h2>

    <!-- Game Board -->
    <div id="game-board">
      <div class="cell" data-index="0" onclick="handleCellClick(0)"></div>
      <div class="cell" data-index="1" onclick="handleCellClick(1)"></div>
      <div class="cell" data-index="2" onclick="handleCellClick(2)"></div>
      <div class="cell" data-index="3" onclick="handleCellClick(3)"></div>
      <div class="cell" data-index="4" onclick="handleCellClick(4)"></div>
      <div class="cell" data-index="5" onclick="handleCellClick(5)"></div>
      <div class="cell" data-index="6" onclick="handleCellClick(6)"></div>
      <div class="cell" data-index="7" onclick="handleCellClick(7)"></div>
      <div class="cell" data-index="8" onclick="handleCellClick(8)"></div>
    </div>

    <!-- Game Status -->
    <p id="game-status"></p>

    <!-- Win Status Container -->
    <div id="win-container">
      <p id="winner-message"></p>
      <button onclick="restartGame()">Restart Game</button>
      <button onclick="goToMainMenu()">Go to Main Menu</button>
    </div>

<!-- JavaScript -->
  <script>
    const board = Array(9).fill(null);
    let currentPlayer = 'X';
    let gameActive = true;
    let computerThinking = false; // Prevent input during computer's turn
  
    const turnIndicator = document.getElementById('turn-indicator');
    const gameStatus = document.getElementById('game-status');
    const cells = document.querySelectorAll('.cell');
    const winContainer = document.getElementById('win-container');
    const winnerMessage = document.getElementById('winner-message');
  
    <!-- const winningCombinations = [
      [0, 1, 2],
      [3, 4, 5],
      [6, 7, 8],
      [0, 3, 6],
      [1, 4, 7],
      [2, 5, 8],
      [0, 4, 8],
      [2, 4, 6],
    ]; -->
  
    let player1Name = localStorage.getItem('player1') || 'Player 1';
    let player2Name = localStorage.getItem('player2') || 'Player 2';
    const gameMode = localStorage.getItem('gameMode') || 'player'; // Default to 'player'
  
    function setGameInfo() {
      turnIndicator.textContent = `Turn: ${player1Name} (X)`;
    }
  
    function handleCellClick(index) {
      if (!gameActive || computerThinking || board[index]) return;
  
      // Player or computer makes a move
      board[index] = currentPlayer;
      cells[index].textContent = currentPlayer;
      cells[index].classList.add(currentPlayer === 'X' ? 'neon-x' : 'neon-o');
  
      if (checkWin(currentPlayer)) {
        gameStatus.textContent = `${currentPlayer === 'X' ? player1Name : player2Name} Wins! 🎉`;
        winnerMessage.textContent = `${currentPlayer === 'X' ? player1Name : player2Name} Wins! 🎉`;
        winContainer.style.display = 'flex';
        gameActive = false;
        return;
      }
  
      if (board.every(cell => cell !== null)) {
        gameStatus.textContent = `It's a Draw!`;
        winnerMessage.textContent = `It's a Draw!`;
        winContainer.style.display = 'flex';
        gameActive = false;
        return;
      }
  
      currentPlayer = currentPlayer === 'X' ? 'O' : 'X';
      turnIndicator.textContent = `Turn: ${currentPlayer === 'X' ? player1Name : player2Name} (${currentPlayer})`;
  
      // Trigger computer move if gameMode is 'computer' and it's the computer's turn
      if (gameMode === 'computer' && currentPlayer === 'O') {
        computerThinking = true;
        setTimeout(computerMove, 500); // Delay for computer move
      }
    }
  
    function checkWin(player) {
      return winningCombinations.some(combination =>
        combination.every(index => board[index] === player)
      );
    }
  
    function computerMove() {
      let bestMove = -1;
      let bestValue = -Infinity;
  
      // Find the best move using Minimax
      for (let i = 0; i < 9; i++) {
        if (board[i] === null) {
          board[i] = 'O';
          let moveValue = minimax(board, 0, false);
          board[i] = null;
  
          if (moveValue > bestValue) {
            bestValue = moveValue;
            bestMove = i;
          }
        }
      }
  
      // Make the move
      board[bestMove] = 'O';
      cells[bestMove].textContent = 'O';
      cells[bestMove].classList.add('neon-o');
  
      // Reset computer thinking and continue game
      computerThinking = false;
      currentPlayer = 'X'; // Switch back to player
      turnIndicator.textContent = `Turn: ${player1Name} (X)`;
  
      if (checkWin('O')) {
        gameStatus.textContent = `${player2Name} Wins! 🎉`;
        winnerMessage.textContent = `${player2Name} Wins! 🎉`;
        winContainer.style.display = 'flex';
        gameActive = false;
        return;
      }
  
      if (board.every(cell => cell !== null)) {
        gameStatus.textContent = `It's a Draw!`;
        winnerMessage.textContent = `It's a Draw!`;
        winContainer.style.display = 'flex';
        gameActive = false;
      }
    }
  
    function minimax(board, depth, isMaximizing) {
      const scores = { 'X': -10, 'O': 10, 'draw': 0 };
      let winner = checkWinner(board);
  
      if (winner) return scores[winner];
      if (board.every(cell => cell !== null)) return scores['draw'];
  
      let bestScore = isMaximizing ? -Infinity : Infinity;
      let comparator = isMaximizing ? Math.max : Math.min;
  
      for (let i = 0; i < 9; i++) {
        if (board[i] === null) {
          board[i] = isMaximizing ? 'O' : 'X';
          let score = minimax(board, depth + 1, !isMaximizing);
          board[i] = null;
          bestScore = comparator(score, bestScore);
        }
      }
      return bestScore;
    }
  
    function checkWinner(board) {
      for (const combination of winningCombinations) {
        const [a, b, c] = combination;
        if (board[a] && board[a] === board[b] && board[a] === board[c]) {
          return board[a];
        }
      }
      return null;
    }
  
    function restartGame() {
      board.fill(null);
      currentPlayer = 'X';
      gameActive = true;
      computerThinking = false;
      turnIndicator.textContent = `Turn: ${player1Name} (X)`;
      gameStatus.textContent = '';
      cells.forEach(cell => {
        cell.textContent = '';
        cell.classList.remove('neon-x', 'neon-o');
      });
      winContainer.style.display = 'none';
    }
        function goToMainMenu() {
    window.location.href = 'index.html';
  }
  
    // Initialize Game
    setGameInfo();
  </script>  
</body>
</html>
